<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>邻寝帮</title>
    <style>
        /* ========== 配色完全取自 Logo 圆形图 ========== */
        :root {
            --navy-dark: #1B2A4A;       /* 圆角方背景深蓝 */
            --navy: #1E3A5F;            /* 文字深蓝 */
            --navy-light: #2C4A73;      /* 浅一点深蓝 */
            --orange-primary: #FF9F43;  /* 笔记本橙黄主色 */
            --orange-light: #FFAA33;    /* 浅橙 */
            --orange-glow: #FFBE4D;     /* 灯泡发光黄 */
            --cream: #FFF8E7;           /* 笔记本内页米白 */
            --bg-page: #F5F6FA;         /* 页面背景 */
            --text-navy: #1B3A5C;       /* 邻寝帮文字同款深蓝 */
            --white: #FFFFFF;
            --border-color: #E8ECF1;
            --shadow-sm: 0 2px 10px rgba(27,42,74,0.06);
            --shadow-md: 0 4px 20px rgba(27,42,74,0.10);
            --shadow-lg: 0 8px 36px rgba(27,42,74,0.14);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg-page);
            color: var(--navy);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ========== 导航栏 ========== */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            background: var(--white);
            border-bottom: 1px solid var(--border-color);
            padding-top: env(safe-area-inset-top);
        }
        .navbar-inner {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .navbar-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-navy);
            letter-spacing: 2px;
        }

        /* ========== 主容器 ========== */
        .page {
            padding-top: calc(44px + env(safe-area-inset-top));
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ======== Hero 区域 — 与 Logo 图 1:1 对应 ======== */
        .hero {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 24px 40px;
        }

        /* Logo 容器：复现圆角方形深蓝底 */
        .logo-container {
            position: relative;
            margin-bottom: 28px;
        }
        .logo-box {
            width: 180px;
            height: 180px;
            border-radius: 36px;
            background: linear-gradient(145deg, var(--navy), var(--navy-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.05);
            animation: breathe 4s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.05); }
            50% { box-shadow: 0 12px 48px rgba(27,42,74,0.22), inset 0 1px 0 rgba(255,255,255,0.08); }
        }

        /* 用 SVG 绘制与 Logo 一致的图标：笔记本+灯泡+跑步人 */
        .logo-icon {
            width: 120px;
            height: 120px;
        }

        /* 品牌名文字 — 与 Logo 下方"邻寝帮"一致 */
        .brand-name {
            font-size: 42px;
            font-weight: 900;
            color: var(--text-navy);
            letter-spacing: 6px;
            line-height: 1.2;
        }

        /* ========== 功能卡片区域 ========== */
        .section {
            width: 100%;
            max-width: 400px;
            padding: 0 20px;
        }

        /* 欢迎卡片 */
        .welcome-card {
            background: var(--white);
            border-radius: 20px;
            padding: 28px 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            text-align: center;
        }
        .welcome-card__tag {
            display: inline-block;
            background: linear-gradient(135deg, var(--orange-primary), var(--orange-glow));
            color: var(--white);
            font-size: 12px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        .welcome-card__title {
            font-size: 20px;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 8px;
        }
        .welcome-card__desc {
            font-size: 14px;
            color: #6B7A94;
            line-height: 1.7;
        }

        /* 功能网格 */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }
        .grid-item {
            background: var(--white);
            border-radius: 16px;
            padding: 22px 16px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: all 0.25s ease;
            border: 1.5px solid transparent;
        }
        .grid-item:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: var(--orange-light);
        }
        .grid-item:active {
            transform: scale(0.97);
        }
        .grid-item__icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 24px;
        }
        .grid-item__icon--orange { background: linear-gradient(135deg, #FFE0B2, var(--orange-primary)); }
        .grid-item__icon--navy   { background: linear-gradient(135deg, var(--navy-light), var(--navy)); }
        .grid-item__icon--gold   { background: linear-gradient(135deg, #FFF3D6, #FFD54F); }
        .grid-item__icon--blue   { background: linear-gradient(135deg, #BBDEFB, #64B5F6); }
        .grid-item__label {
            font-size: 14px;
            font-weight: 600;
            color: var(--navy);
        }
        .grid-item__sub {
            font-size: 11px;
            color: #8896A8;
            margin-top: 4px;
        }

        /* 主按钮 — 橙色渐变呼应 Logo */
        .cta-btn {
            width: 100%;
            max-width: 340px;
            padding: 16px 0;
            border: none;
            border-radius: 28px;
            font-size: 17px;
            font-weight: 700;
            color: var(--white);
            background: linear-gradient(135deg, var(--orange-primary), #FF8C00);
            box-shadow: 0 4px 16px rgba(255,159,67,0.35);
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 3px;
            margin: 0 auto 10px;
            display: block;
        }
        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(255,159,67,0.45);
        }
        .cta-btn:active { transform: scale(0.97); }

        /* 次级按钮 — 深蓝描边 */
        .cta-btn--outline {
            background: transparent;
            color: var(--navy);
            border: 2px solid var(--navy);
            box-shadow: none;
            margin-bottom: 30px;
        }
        .cta-btn--outline:hover {
            background: var(--navy);
            color: var(--white);
            box-shadow: var(--shadow-md);
        }

        /* 底部 */
        .footer {
            margin-top: auto;
            padding: 24px 20px 30px;
            text-align: center;
            font-size: 12px;
            color: #A0ABC0;
        }

        /* 安全区 */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .footer { padding-bottom: calc(30px + env(safe-area-inset-bottom)); }
        }

        /* PC端居中模拟手机 */
        @media screen and (min-width: 768px) {
            .page {
                max-width: 420px;
                margin: 0 auto;
                min-height: 100vh;
                background: var(--bg-page);
                position: relative;
                box-shadow: 0 0 60px rgba(27,42,74,0.08);
            }
            body { background: #DFE2EA; }
        }
    </style>
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar">
    <div class="navbar-inner">
        <span class="navbar-title">邻寝帮</span>
    </div>
</nav>

<!-- 主页面 -->
<div class="page">

    <!-- Hero：Logo + 品牌名（与参考图 1:1） -->
    <section class="hero">
        <div class="logo-container">
            <!-- 深蓝圆角方形 + 内部 SVG 图标 -->
            <div class="logo-box">
                <svg class="logo-icon" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- 橙色笔记本主体 -->
                    <rect x="20" y="26" width="72" height="58" rx="8" fill="#FF9F43"/>
                    <rect x="20" y="26" width="72" height="12" rx="4" fill="#FFAA33"/>
                    <!-- 笔记本内页（米白色） -->
                    <rect x="32" y="38" width="48" height="34" rx="3" fill="#FFF8E7"/>
                    <!-- 左侧装订线 -->
                    <rect x="23" y="36" width="5" height="8" rx="1.5" fill="#FFE0B2"/>
                    <rect x="23" y="50" width="5" height="8" rx="1.5" fill="#FFE0B2"/>
                    <rect x="23" y="64" width="5" height="8" rx="1.5" fill="#FFE0B2"/>
                    <!-- 底部装饰块 -->
                    <rect x="32" y="76" width="14" height="6" rx="2" fill="#FF8C00"/>
                    <!-- 内页横线 -->
                    <line x1="38" y1="54" x2="74" y2="54" stroke="#FFE0B2" stroke-width="1.5" stroke-linecap="round"/>
                    <line x1="38" y1="62" x2="66" y2="62" stroke="#FFE0B2" stroke-width="1.5" stroke-linecap="round"/>

                    <!-- 灯泡（橙黄色） -->
                    <circle cx="64" cy="50" r="9" fill="#FFBE4D"/>
                    <path d="M64 44 L64 41 M59 47 L56 44 M69 47 L72 44 M61 53 L58 56 M67 53 L70 56"
                          stroke="#FFBE4D" stroke-width="1.8" stroke-linecap="round"/>
                    <rect x="61" y="57" width="6" height="5" rx="1.5" fill="#FF9F43"/>
                    <line x1="63" y1="59" x2="65" y2="59" stroke="#FFE0B2" stroke-width="0.8" stroke-linecap="round"/>
                    <line x1="63" y1="61" x2="65" y2="61" stroke="#FFE0B2" stroke-width="0.8" stroke-linecap="round"/>

                    <!-- 跑步人形剪影（深蓝色） -->
                    <circle cx="86" cy="52" r="5.5" fill="#1B2A4A"/>
                    <path d="M82 58 Q80 65 77 70 L73 78 Q72 81 75 82 L79 79 Q83 72 85 66 L89 62 Q92 60 93 57 L90 55 Q87 56 84 58 Z"
                          fill="#1B2A4A"/>
                    <path d="M79 79 L74 91 Q73 94 76 95 L80 90 L84 80 Z" fill="#1B2A4A"/>
                    <path d="M86 66 L95 71 Q98 72 97 75 L92 73 L85 69 Z" fill="#1B2A4A"/>
                </svg>
            </div>
        </div>
        <!-- 品牌文字：与 Logo 下方一致 -->
        <h1 class="brand-name">邻寝帮</h1>
    </section>

    <!-- 内容区域 -->
    <section class="section">

        <!-- 欢迎卡片 -->
        <div class="welcome-card">
            <span class="welcome-card-tag">寝室生活助手</span>
            <h2 class="welcome-card__title">让邻里互助更简单</h2>
            <p class="welcome-card__desc">代取快递 · 带饭帮忙 · 失物招领<br>拼单团购 · 寝室闲聊 · 更多服务</p>
        </div>

        <!-- 功能入口网格 -->
        <div class="grid">
            <div class="grid-item">
                <div class="grid-item__icon grid-item__icon--orange">📦</div>
                <div class="grid-item__label">代取快递</div>
                <div class="grid-item__sub">楼下帮忙拿</div>
            </div>
            <div class="grid-item">
                <div class="grid-item__icon grid-item__icon--navy">🍜</div>
                <div class="grid-item__label">带饭帮忙</div>
                <div class="grid-item__sub">食堂顺路带</div>
            </div>
            <div class="grid-item">
                <div class="grid-item__icon grid-item__icon--gold">📢</div>
                <div class="grid-item__label">失物招领</div>
                <div class="grid-item__sub">丢失找回来</div>
            </div>
            <div class="grid-item">
                <div class="grid-item__icon grid-item__icon--blue">💬</div>
                <div class="grid-item__label">寝室闲聊</div>
                <div class="grid-item__sub">邻里聊聊天</div>
            </div>
        </div>

        <!-- 主操作按钮 -->
        <button class="cta-btn">立即使用</button>
        <button class="cta-btn cta-btn--outline">了解更多</button>

    </section>

    <!-- 底部 -->
    <footer class="footer">
        邻寝帮 v1.0.0 · 基于 uni-app 构建
    </footer>

</div>

<script>
    document.querySelectorAll('.grid-item').forEach(el => {
        el.addEventListener('click', () => {
            const label = el.querySelector('.grid-item__label').textContent;
            console.log(`[邻寝帮] 点击：${label}`);
        });
    });
    document.querySelector('.cta-btn').addEventListener('click', () => console.log('[邻寝帮] 点击立即使用'));
</script>

</body>
</html>
