<script>
        (function() {
            const isLoggedIn = localStorage.getItem('campus_user_logged_in') === 'true';
            document.getElementById('profile-logged-out').classList.toggle('hidden', isLoggedIn);
            document.getElementById('profile-logged-in').classList.toggle('hidden', !isLoggedIn);
        })();

        function showToast(msg) {
            var toast = document.createElement('div');
            toast.textContent = msg;
            toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;z-index:9999;white-space:nowrap;';
            document.body.appendChild(toast);
            setTimeout(function() {
                toast.style.transition = 'opacity 0.3s';
                toast.style.opacity = '0';
                setTimeout(function() { document.body.removeChild(toast); }, 300);
            }, 1500);
        }

        function doLogout() {
            localStorage.removeItem('campus_user_logged_in');
            localStorage.removeItem('campus_user_name');
            localStorage.removeItem('campus_user_phone');
            showToast('已退出登录');
            setTimeout(() => {
                location.reload();
            }, 500);
        }
    </script>
