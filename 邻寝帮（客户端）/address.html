<script>
        function toggleModal(show) {
            const modal = document.getElementById('address-modal');
            const content = document.getElementById('modal-content');
            if(show) {
                modal.classList.remove('hidden');
                setTimeout(() => content.style.transform = 'translateY(0)', 10);
            } else {
                content.style.transform = 'translateY(100%)';
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
        }

        function saveAddress() {
            showToast('地址保存成功');
            toggleModal(false);
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.textContent = msg;
            toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;z-index:9999;white-space:nowrap;';
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.transition = 'opacity 0.3s';
                toast.style.opacity = '0';
                setTimeout(() => document.body.removeChild(toast), 300);
            }, 1500);
        }

        let clicks = 0;
        function activateDev() {
            clicks++;
            if(clicks >= 5) {
                localStorage.setItem('campus_dev_mode', 'true');
                showToast('开发者模式已开启');
                setTimeout(() => location.reload(), 800);
            }
        }
    </script>
