<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>注册 - 邻寝帮</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<link href="./common.css" rel="stylesheet"/>
<style>
        body { background-color: #F5F8FA; font-family: -apple-system, sans-serif; color: #333; }
        .bg-main-blue { background-color: #1E3A5F; }
        .card-shadow { box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
<div class="w-[375px] h-[812px] bg-[#F5F8FA] overflow-hidden flex flex-col relative shadow-2xl">
<div class="bg-main-gradient h-[220px] flex-none flex flex-col items-center justify-center text-white relative overflow-hidden">
<div class="decor-circle-1"></div>
<div class="decor-circle-2"></div>
<div class="bg-white p-2 rounded-[20px] mb-3 relative z-10" style="box-shadow: 0 10px 28px rgba(0,0,0,0.16);">
<img alt="邻寝帮" class="brand-logo" src="./logo.jpg" style="width:64px;height:64px;border-radius:14px;"/>
</div>
<h1 class="text-[22px] font-extrabold relative z-10">邻寝帮</h1>
<p class="text-[13px] text-white/85 text-center mt-1.5 relative z-10">取快递、带三餐，邻寝帮随叫随到</p>
</div>
<div class="flex-1 px-[14px] -mt-8 relative z-10">
<div class="bg-white rounded-2xl card-shadow-md p-5 space-y-3.5 border border-white">
<div class="bg-[#F5F7FA] rounded-xl px-4 py-3.5 focus-within:bg-white focus-within:ring-2 focus-within:ring-[#1E3A5F]/10 transition-all">
<input class="bg-transparent outline-none text-[14px] w-full" placeholder="手机号" type="tel"/>
</div>
<div class="flex gap-2">
<div class="flex-1 bg-[#F5F7FA] rounded-xl px-4 py-3.5 focus-within:bg-white focus-within:ring-2 focus-within:ring-[#1E3A5F]/10 transition-all">
<input class="bg-transparent outline-none text-[14px] w-full" placeholder="验证码" type="number"/>
</div>
<button class="text-[#1E3A5F] text-[13px] font-bold px-3 whitespace-nowrap">获取验证码</button>
</div>
<div class="bg-[#F5F7FA] rounded-xl px-4 py-3.5 focus-within:bg-white focus-within:ring-2 focus-within:ring-[#1E3A5F]/10 transition-all">
<input class="bg-transparent outline-none text-[14px] w-full" placeholder="设置密码" type="password"/>
</div>
<div class="bg-[#F5F7FA] rounded-xl px-4 py-3.5 focus-within:bg-white focus-within:ring-2 focus-within:ring-[#1E3A5F]/10 transition-all">
<input class="bg-transparent outline-none text-[14px] w-full" placeholder="确认密码" type="password"/>
</div>
<button class="w-full bg-main-gradient text-white py-3.5 rounded-xl text-[16px] font-bold mt-2 shadow-lg active:opacity-90" onclick="handleRegister()">立即注册</button>
</div>
<div class="mt-6 text-center">
<span class="text-[14px] text-gray-400">已有账号？</span>
<a class="text-[#1E3A5F] text-[14px] font-bold" href="./login.html">立即登录</a>
</div>
</div>
</div>
<script>
        function handleRegister() {
            showToast('注册成功！');
            setTimeout(() => {
                window.location.href = './login.html';
            }, 1000);
        }

        function showToast(msg) {
            var toast = document.createElement('div');
            toast.textContent = msg;
            toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;z-index:9999;white-space:nowrap;';
            document.body.appendChild(toast);
            setTimeout(function() {
                toast.style.transition = 'opacity 0.3s';
                toast.style.opacity = '0';
                setTimeout(function() { document.body.removeChild(toast); }, 300);
            }, 1500);
        }
    </script>
</body>
</html>
