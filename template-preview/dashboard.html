<!DOCTYPE html>

<div class="grid grid-cols-2 gap-[10px]">

</div>
</div>
<div class="bg-white p-[14px] rounded-xl card-shadow">

<iconify-icon class="text-main-blue mr-2" icon="mdi:finance"></iconify-icon>
                    平台抽成分布
                </h3>
<div class="space-y-3">
<div class="flex items-center">
<span class="text-[11px] text-gray-500 w-20">18% (0-50单)</span>
<div class="flex-1 h-2 bg-gray-50 rounded-full overflow-hidden mx-3">
<div class="h-full bg-blue-200" style="width: 45%"></div>
</div>
<span class="text-[11px] font-bold">45%</span>
</div>
<div class="flex items-center">
<span class="text-[11px] text-gray-500 w-20">15% (51-100单)</span>
<div class="flex-1 h-2 bg-gray-50 rounded-full overflow-hidden mx-3">

</div>

</div>
<div class="flex items-center">
<span class="text-[11px] text-gray-500 w-20">12% (101-200单)</span>
<div class="flex-1 h-2 bg-gray-50 rounded-full overflow-hidden mx-3">

</div>

<div class="flex items-center">

<div class="flex-1 h-2 bg-gray-50 rounded-full overflow-hidden mx-3">

</div>
<span class="text-[11px] font-bold">10%</span>
</div>
</div>
</div>
<div class="bg-white p-[14px] rounded-xl card-shadow" onclick="showToast('近期趋势图表')">

<div class="flex items-end justify-between h-24 gap-2">
<div class="flex-1 bg-blue-50 rounded-t h-[60%]"></div>
<div class="flex-1 bg-blue-50 rounded-t h-[40%]"></div>
<div class="flex-1 bg-blue-50 rounded-t h-[80%]"></div>
<div class="flex-1 bg-blue-400 rounded-t h-[100%]"></div>

<div class="flex-1 bg-blue-50 rounded-t h-[50%]"></div>
<div class="flex-1 bg-blue-50 rounded-t h-[65%]"></div>
</div>
<div class="flex justify-between mt-2 text-[10px] text-gray-300">
<span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>

</div>

<nav class="absolute bottom-0 left-0 right-0 h-[52px] bg-white border-t border-gray-100 flex items-center justify-around z-[100]">

<span class="text-[10px]">我的</span>
</a>
</nav>
</div>
<script>
        function showToast(msg) {
            var toast = document.createElement('div');
            toast.textContent = msg;
            toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;z-index:9999;white-space:nowrap;';
            document.body.appendChild(toast);
            setTimeout(function() {
                toast.style.transition = 'opacity 0.3s';
                toast.style.opacity = '0';
                setTimeout(function() { document.body.removeChild(toast); }, 300);
            }, 1500);
        }
    </script>
</body>
</html>
