<script>
        function togglePricing() {
            const content = document.getElementById('pricing-content');
            const icon = document.getElementById('pricing-icon');
            content.classList.toggle('hidden');
            icon.style.transform = content.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
        }

        function showToast(msg) {
            var toast = document.createElement('div');
            toast.textContent = msg;
            toast.style.cssText = 
                'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);' +
                'background:rgba(0,0,0,0.78);color:#fff;padding:12px 28px;' +
                'border-radius:24px;font-size:14px;z-index:9999;white-space:nowrap;' +
                'pointer-events:none;';
            document.body.appendChild(toast);
            setTimeout(function() {
                toast.style.transition = 'opacity 0.3s';
                toast.style.opacity = '0';
                setTimeout(function() {
                    if (toast.parentNode) toast.parentNode.removeChild(toast);
                }, 300);
            }, 1500);
        }
    </script>
