<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>登录 - 邻寝帮</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<style>
        body { background-color: #F5F8FA; font-family: -apple-system, sans-serif; color: #333; }
        .bg-main-blue { background-color: #4A90D9; }
        .text-main-blue { color: #4A90D9; }
        .card-shadow { box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
        .tab-active { color: #4A90D9; border-bottom: 2px solid #4A90D9; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
<div class="w-[375px] h-[812px] bg-[#F5F8FA] overflow-hidden flex flex-col relative shadow-2xl">
<!-- 顶部品牌区 - 优化 -->
<div class="bg-main-blue h-[220px] flex-none flex flex-col items-center justify-center text-white relative overflow-hidden">
<!-- 装饰圆圈 -->
<div class="absolute -top-10 -left-10 w-40 h-40 bg-white/10 rounded-full"></div>
<div class="absolute top-20 -right-5 w-24 h-24 bg-white/5 rounded-full"></div>
<div class="bg-white/20 p-4 rounded-3xl mb-3 relative z-10 backdrop-blur-sm border border-white/30">
<iconify-icon class="text-5xl text-white" icon="mdi:run-fast"></iconify-icon>
</div>
<h1 class="text-[24px] font-bold tracking-widest relative z-10">邻寝帮</h1>
<p class="text-[13px] text-white/80 text-center mt-2 relative z-10">取快递、带三餐，邻寝帮随叫随到</p>
</div>
<!-- 登录内容区 -->
<div class="flex-1 px-[14px] -mt-10 relative z-20">
<div class="bg-white rounded-2xl card-shadow overflow-hidden border border-white">
<div class="flex border-b border-gray-50">
<button class="flex-1 py-4 text-[14px] font-bold tab-active transition-all" id="tab-code" onclick="switchTab('code')">验证码登录</button>
<button class="flex-1 py-4 text-[14px] font-medium text-gray-400 transition-all" id="tab-pwd" onclick="switchTab('pwd')">账号登录</button>
</div>
<div class="p-5 space-y-4">
<button class="w-full bg-blue-50 border border-blue-100 text-main-blue py-3 rounded-xl text-[13px] font-bold flex items-center justify-center gap-2 active:scale-[0.98] transition-all" onclick="demoLogin()">
<iconify-icon class="text-lg" icon="mdi:auto-fix"></iconify-icon>
                        体验模式 - 快速免密进入
                    </button>
<div class="space-y-3" id="form-code">
<div class="bg-gray-50 rounded-xl px-4 py-3.5 flex items-center border border-transparent focus-within:border-blue-100 transition-all">
<span class="text-gray-400 text-[14px] mr-3 border-r pr-3">+86</span>
<input class="bg-transparent outline-none text-[14px] w-full" id="phone-code" maxlength="11" placeholder="请输入手机号" type="tel"/>
</div>
<div class="flex gap-2">
<div class="flex-1 bg-gray-50 rounded-xl px-4 py-3.5 border border-transparent focus-within:border-blue-100 transition-all">
<input class="bg-transparent outline-none text-[14px] w-full" id="verify-code" placeholder="验证码" type="number"/>
</div>
<button class="text-main-blue text-[13px] font-bold px-3" onclick="getCode(this)">获取验证码</button>
</div>
<button class="w-full bg-main-blue text-white py-3.5 rounded-xl text-[16px] font-bold mt-2 shadow-lg shadow-blue-100 active:opacity-90" onclick="handleLogin('code')">登录</button>
</div>
<div class="hidden space-y-3" id="form-pwd">
<div class="bg-gray-50 rounded-xl px-4 py-3.5 flex items-center border border-transparent focus-within:border-blue-100 transition-all">
<iconify-icon class="text-gray-400 text-xl mr-3" icon="mdi:account-outline"></iconify-icon>
<input class="bg-transparent outline-none text-[14px] w-full" id="phone-pwd" placeholder="手机号/用户名" type="text"/>
</div>
<div class="bg-gray-50 rounded-xl px-4 py-3.5 flex items-center border border-transparent focus-within:border-blue-100 transition-all">
<iconify-icon class="text-gray-400 text-xl mr-3" icon="mdi:lock-outline"></iconify-icon>
<input class="bg-transparent outline-none text-[14px] w-full" id="password" placeholder="请输入密码" type="password"/>
</div>
<button class="w-full bg-main-blue text-white py-3.5 rounded-xl text-[16px] font-bold mt-2 shadow-lg shadow-blue-100 active:opacity-90" onclick="handleLogin('pwd')">登录</button>
</div>
<p class="text-center text-[11px] text-gray-400 mt-4 leading-relaxed">
                        登录即同意 <a class="text-main-blue font-medium" href="javascript:void(0)" onclick="showToast('服务协议已弹出')">《用户服务协议》</a> 和 <a class="text-main-blue font-medium" href="javascript:void(0)" onclick="showToast('隐私政策已弹出')">《隐私政策》</a>
</p>
</div>
</div>
<div class="mt-8 text-center">
<span class="text-[14px] text-gray-400">还没有账号？</span>
<a class="text-main-blue text-[14px] font-bold" href="./register.html">立即注册账号</a>
</div>
</div>
<div class="p-6 text-center">
<a class="text-[13px] text-gray-400 flex items-center justify-center font-medium" href="./rider-login.html">
<iconify-icon class="mr-2 text-lg" icon="mdi:bike-fast"></iconify-icon>
                切换到骑手端 <iconify-icon class="ml-1" icon="mdi:chevron-right"></iconify-icon>
</a>
<div class="mt-6 text-[10px] text-gray-200 cursor-pointer" id="dev-trigger" onclick="activateDev()">CAMPUS ERRAND V2.0</div>
</div>
</div>
<script>
        function showToast(msg) {
            var toast = document.createElement('div');
            toast.textContent = msg;
            toast.style.cssText = 
                'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);' +
                'background:rgba(0,0,0,0.78);color:#fff;padding:12px 28px;' +
                'border-radius:24px;font-size:14px;z-index:9999;white-space:nowrap;' +
                'pointer-events:none;';
            document.body.appendChild(toast);
            setTimeout(function() {
                toast.style.transition = 'opacity 0.3s';
                toast.style.opacity = '0';
                setTimeout(function() {
                    if (toast.parentNode) toast.parentNode.removeChild(toast);
                }, 300);
            }, 1500);
        }

        function switchTab(type) {
            document.getElementById('tab-code').className = `flex-1 py-4 text-[14px] ${type === 'code' ? 'tab-active font-bold' : 'text-gray-400 font-medium'}`;
            document.getElementById('tab-pwd').className = `flex-1 py-4 text-[14px] ${type === 'pwd' ? 'tab-active font-bold' : 'text-gray-400 font-medium'}`;
            document.getElementById('form-code').classList.toggle('hidden', type !== 'code');
            document.getElementById('form-pwd').classList.toggle('hidden', type !== 'pwd');
        }

        function getCode(btn) {
            const phone = document.getElementById('phone-code').value;
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                showToast('请输入正确的手机号');
                return;
            }
            showToast('验证码已发送');
            let time = 60;
            btn.disabled = true;
            const timer = setInterval(() => {
                btn.innerText = `${time}s`;
                if (time-- <= 0) {
                    clearInterval(timer);
                    btn.innerText = '获取验证码';
                    btn.disabled = false;
                }
            }, 1000);
        }

        function demoLogin() {
            localStorage.setItem('campus_user_logged_in', 'true');
            localStorage.setItem('campus_user_name', '体验用户');
            showToast('欢迎回来！体验模式已开启');
            setTimeout(() => location.href = './home.html', 1200);
        }

        function handleLogin(type) {
            const phone = type === 'code' ? document.getElementById('phone-code').value : document.getElementById('phone-pwd').value;
            if (!phone) {
                showToast('请输入手机号');
                return;
            }
            demoLogin();
        }

        function activateDev() {
            showToast('开发者模式已激活');
        }
    </script>
</body>
</html>
